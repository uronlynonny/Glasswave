# Glasswave for iPhone: the Xcode project is made from this file by XcodeGen (on GitHub's Macs:
# `xcodegen` in this folder), so there's no hand-edited .xcodeproj to keep in step.
name: Glasswave
options:
  bundleIdPrefix: com.glasswave
  deploymentTarget:
    iOS: "16.0"
packages:
  # Finds each song's audio on YouTube (the phone and PC apps use NewPipe, which can't run on iOS).
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.10
targets:
  Glasswave:
    type: application
    platform: iOS
    sources:
      - Glasswave
    dependencies:
      - package: YouTubeKit
    preBuildScripts:
      # The screens and player logic: the Kotlin part, built by Gradle into GlasswaveKit.framework.
      - name: Build the Kotlin part
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew -p ios embedAndSignAppleFrameworkForXcode --no-daemon
    info:
      path: Glasswave/Info.plist
      properties:
        CFBundleDisplayName: Glasswave
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glasswave.player
        PRODUCT_NAME: Glasswave
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework GlasswaveKit"
        # Not signed here: SideStore / AltStore sign it with each person's own Apple ID when they install it.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
