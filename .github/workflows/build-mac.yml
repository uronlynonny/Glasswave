name: Build Glasswave for Mac

# A Mac installer has to be made on a Mac, so GitHub's own Macs (Apple Silicon) build it whenever
# the desktop app changes on main. The .dmg goes up to the rolling "mac" release, which the
# website's Mac button links to (releases/download/mac/Glasswave-Mac.dmg).
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'app/build.gradle.kts', '.github/workflows/build-mac.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the Mac installer
        run: sh ./gradlew -p desktop packageDmg --no-daemon --stacktrace

      - name: Put it on the "mac" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DMG=$(find desktop -path '*binaries/main/dmg/*.dmg' | head -1)
          VERSION=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "Built $DMG ($VERSION)"
          if ! gh release view mac >/dev/null 2>&1; then
            gh release create mac --title "Glasswave for Mac $VERSION" --latest=false \
              --notes "Glasswave for Mac (Apple Silicon). Open the .dmg and drag Glasswave to Applications. The first time, right-click Glasswave and choose Open."
          fi
          # Upload under a new name first, then swap, so the download link never breaks.
          cp "$DMG" "Glasswave-Mac-$VERSION.dmg"
          gh release upload mac "Glasswave-Mac-$VERSION.dmg" --clobber
          OLD=$(gh api repos/${{ github.repository }}/releases/tags/mac --jq '.assets[] | select(.name=="Glasswave-Mac.dmg") | .id')
          NEW=$(gh api repos/${{ github.repository }}/releases/tags/mac --jq ".assets[] | select(.name==\"Glasswave-Mac-$VERSION.dmg\") | .id")
          if [ -n "$OLD" ]; then gh api -X DELETE repos/${{ github.repository }}/releases/assets/$OLD; fi
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$NEW -f name=Glasswave-Mac.dmg
          gh release edit mac --title "Glasswave for Mac $VERSION"
