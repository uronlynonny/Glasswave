name: Build Glasswave for iPhone

# An iPhone app has to be built on a Mac, so GitHub's own Macs build it whenever ios/ changes.
# Each run also tries it on a simulated iPhone (search, play, full player, lyrics) and keeps the
# screenshots and log with the run. On main, the unsigned .ipa goes up to the rolling "ios"
# release; people install it with SideStore or AltStore, which sign it with their own Apple ID.
on:
  push:
    paths: ['ios/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Keep Kotlin/Native and Gradle downloads between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ios-${{ runner.os }}-${{ hashFiles('ios/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ios-${{ runner.os }}-

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios/iosApp && xcodegen

      - name: Build for the simulated iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/iosApp/Glasswave.xcodeproj -scheme Glasswave -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee "$RUNNER_TEMP/sim-build.log" | grep -E "error:|warning: unable|BUILD|e: " || true
          test -d "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/Glasswave.app"

      - name: Try it on a simulated iPhone
        run: |
          mkdir -p out
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/Glasswave.app"
          SIMCTL_CHILD_GW_SCRIPT="wait 3; search Essence Wizkid; wait 8; play 0; wait 12; state; wait 8; state; open; wait 3; lyrics on; wait 6; state; lyrics off; queue on; wait 3; state" \
            xcrun simctl launch --stdout="$PWD/out/stdout.txt" --stderr="$PWD/out/stderr.txt" "$DEV" com.glasswave.player
          sleep 10; xcrun simctl io "$DEV" screenshot out/1-search.png
          sleep 14; xcrun simctl io "$DEV" screenshot out/2-playing.png
          sleep 9;  xcrun simctl io "$DEV" screenshot out/3-player.png
          sleep 9;  xcrun simctl io "$DEV" screenshot out/4-lyrics.png
          sleep 4;  xcrun simctl io "$DEV" screenshot out/5-queue.png
          CONT=$(xcrun simctl get_app_container "$DEV" com.glasswave.player data || true)
          cp "$CONT/Documents/glasswave.log" out/ 2>/dev/null || echo "no log"
          cp ~/Library/Logs/DiagnosticReports/*Glasswave* out/ 2>/dev/null || true
          cat out/glasswave.log 2>/dev/null || true

      - name: Build the iPhone app (unsigned .ipa)
        run: |
          set -o pipefail
          xcodebuild -project ios/iosApp/Glasswave.xcodeproj -scheme Glasswave -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dev" \
            build 2>&1 | tee "$RUNNER_TEMP/dev-build.log" | grep -E "error:|BUILD|e: " || true
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/dev/Build/Products/Release-iphoneos/Glasswave.app" Payload/
          zip -qry out/Glasswave.ipa Payload
          ls -la out

      - name: Keep the build logs
        if: always()
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP"/*-build.log out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glasswave-ios
          path: out/

      - name: Put it on the "ios" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' ios/iosApp/project.yml)
          if ! gh release view ios >/dev/null 2>&1; then
            gh release create ios --title "Glasswave for iPhone $VERSION" --latest=false \
              --notes "Glasswave for iPhone. Install Glasswave-iOS.ipa with SideStore or AltStore (they sign it with your own Apple ID; refresh it every 7 days)."
          fi
          # Upload under a new name first, then swap, so the download link never breaks.
          cp out/Glasswave.ipa "Glasswave-iOS-$VERSION.ipa"
          gh release upload ios "Glasswave-iOS-$VERSION.ipa" --clobber
          OLD=$(gh api repos/${{ github.repository }}/releases/tags/ios --jq '.assets[] | select(.name=="Glasswave-iOS.ipa") | .id')
          NEW=$(gh api repos/${{ github.repository }}/releases/tags/ios --jq ".assets[] | select(.name==\"Glasswave-iOS-$VERSION.ipa\") | .id")
          if [ -n "$OLD" ]; then gh api -X DELETE repos/${{ github.repository }}/releases/assets/$OLD; fi
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$NEW -f name=Glasswave-iOS.ipa
          gh release edit ios --title "Glasswave for iPhone $VERSION"
