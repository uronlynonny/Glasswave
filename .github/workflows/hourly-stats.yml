# Every hour: counts the website's visits and downloads (from the ntfy alerts the site sends),
# reads GitHub's own download counter for the APK, sends nonny dev a summary on ntfy and keeps
# running totals in stats.json on the "stats" branch (shown on the site's stats page).
name: Hourly stats

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: hourly-stats

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      TOPIC: glasswave-nonny-re7mnsuqhuis
      # The apps' anonymous once-a-day "in use" check-ins (a random install id, platform, version).
      ACTIVE_TOPIC: glasswave-nonny-re7mnsuqhuis-active
      # Songs nonny dev marked fixed (the "Mark fixed" button on a "Song won't play" report).
      FIXED_TOPIC: glasswave-nonny-re7mnsuqhuis-fixed
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: data

      - name: Count and send the summary
        run: |
          set -euo pipefail
          F=data/stats.json
          [ -f "$F" ] || echo '{"lastTime":0,"totals":{"visits":0,"siteDownloads":0},"apkTotal":null,"hours":[]}' > "$F"
          last=$(jq -r '.lastTime // 0' "$F")
          now=$(date +%s)

          # Alerts since the last run (ntfy keeps them for 12 hours).
          since=$([ "$last" -gt 0 ] && echo "$last" || echo all)
          curl -fsS "https://ntfy.sh/$TOPIC/json?poll=1&since=$since" > msgs.jsonl || : > msgs.jsonl
          v=$(jq -s --argjson l "$last" '[.[] | select(.event=="message" and .time > $l and .title=="New visitor")] | length' msgs.jsonl)
          d=$(jq -s --argjson l "$last" '[.[] | select(.event=="message" and .time > $l and .title=="New download")] | length' msgs.jsonl)
          newLast=$(jq -s --argjson l "$last" '[.[] | select(.event=="message") | .time] + [$l] | max' msgs.jsonl)

          # Every APK download GitHub has counted (site button, releases page and in-app updates).
          apk=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | jq '[.[].assets[] | select(.name | endswith(".apk")) | .download_count] | add // 0')
          prevApk=$(jq -r '.apkTotal // empty' "$F")
          a=$([ -n "$prevApk" ] && echo $((apk - prevApk)) || echo 0)
          [ "$a" -lt 0 ] && a=0

          # Songs that wouldn't play for someone (reported by the app), kept for fixing later.
          jq -s --argjson l "$last" '[.[] | select(.event=="message" and .time > $l and .title=="Song failed") | {t: .time, m: .message}]' msgs.jsonl > failed.json
          f=$(jq 'length' failed.json)

          # Active users: each app checks in once a day with a random id. Keep who was seen each day
          # (UTC) for 35 days, and work out daily, 7-day and 30-day counts per platform.
          lastA=$(jq -r '.lastActiveTime // 0' "$F")
          sinceA=$([ "$lastA" -gt 0 ] && echo "$lastA" || echo all)
          curl -fsS "https://ntfy.sh/$ACTIVE_TOPIC/json?poll=1&since=$sinceA" > active.jsonl || : > active.jsonl
          jq -s --argjson l "$lastA" '[.[] | select(.event=="message" and .time >= $l)
            | (.message | try fromjson catch null) as $m | select($m != null and ($m.id|type)=="string")
            | {day: (.time | strftime("%Y-%m-%d")), p: (if $m.p == "windows" then "w" else "a" end), id: $m.id[0:40], t: .time}]' active.jsonl > seen.json
          newLastA=$(jq --argjson l "$lastA" '[.[].t] + [$l] | max' seen.json)
          jq --argjson t "$now" --argjson lastA "$newLastA" --slurpfile seen seen.json '
            def uniq(ids; from; p): [ids | to_entries[] | select(.key >= from) | .value[p] // [] | .[]] | unique | length;
            .lastActiveTime = $lastA
            | .activeIds = (reduce $seen[0][] as $s (.activeIds // {};
                .[$s.day][$s.p] = (((.[$s.day][$s.p] // []) + [$s.id]) | unique)))
            | .activeIds |= with_entries(select(.key >= (($t - 35*86400) | strftime("%Y-%m-%d"))))
            | ($t | strftime("%Y-%m-%d")) as $today
            | (($t - 6*86400) | strftime("%Y-%m-%d")) as $wk
            | (($t - 29*86400) | strftime("%Y-%m-%d")) as $mo
            | .active = {
                today: {a: ((.activeIds[$today].a // []) | length), w: ((.activeIds[$today].w // []) | length)},
                week: {a: uniq(.activeIds; $wk; "a"), w: uniq(.activeIds; $wk; "w")},
                month: {a: uniq(.activeIds; $mo; "a"), w: uniq(.activeIds; $mo; "w")},
                daily: [.activeIds | to_entries | sort_by(.key) | .[-30:][] | {d: .key, a: ((.value.a // []) | length), w: ((.value.w // []) | length)}]
              }
          ' "$F" > tmp.json && mv tmp.json "$F"

          # Fixed songs: ntfy keeps messages for 12 hours, so each fix is copied into fixed.json (kept
          # 90 days). The apps read it to tell whoever reported a song that it's fixed, even if
          # they haven't opened Glasswave for days.
          FX=data/fixed.json
          [ -f "$FX" ] || echo '[]' > "$FX"
          lastF=$(jq -r '.lastFixedTime // 0' "$F")
          sinceF=$([ "$lastF" -gt 0 ] && echo "$lastF" || echo all)
          curl -fsS "https://ntfy.sh/$FIXED_TOPIC/json?poll=1&since=$sinceF" > fixed.jsonl || : > fixed.jsonl
          jq -s --argjson l "$lastF" '[.[] | select(.event=="message" and .time > $l)
            | (.message | try fromjson catch null) as $m | select($m != null and ($m.u|type)=="string")
            | {u: $m.u, t: ($m.t // ""), at: .time}]' fixed.jsonl > newfixed.json
          newLastF=$(jq --argjson l "$lastF" '[.[].at] + [$l] | max' newfixed.json)
          jq --argjson now "$now" --slurpfile n newfixed.json '(. + $n[0]) | map(select(.at > $now - 90*86400)) | unique_by(.u + "|" + (.at|tostring))' "$FX" > tmp.json && mv tmp.json "$FX"
          jq --argjson l "$newLastF" '.lastFixedTime = $l' "$F" > tmp.json && mv tmp.json "$F"

          jq --argjson t "$now" --argjson last "$newLast" --argjson v "$v" --argjson d "$d" --argjson a "$a" --argjson apk "$apk" \
             --slurpfile failed failed.json '
            .updated = $t | .lastTime = $last
            | .failedSongs = (((.failedSongs // []) + $failed[0]) | .[-500:])
            # Our own running total: old releases can be deleted (taking their counts with them).
            | .totals.apk = ((.totals.apk // .apkTotal // 0) + $a)
            | .apkTotal = $apk
            | .totals.visits += $v | .totals.siteDownloads += $d
            | .hours = ((.hours + [{t: $t, v: $v, d: $d, a: $a}]) | .[-2160:])
          ' "$F" > tmp.json && mv tmp.json "$F"

          tv=$(jq '.totals.visits' "$F"); td=$(jq '.totals.siteDownloads' "$F"); apk=$(jq '.totals.apk' "$F")
          pl() { [ "$1" -eq 1 ] && echo "$1 $2" || echo "$1 $3"; }
          msg="Last hour: $(pl $v visit visits), $(pl $d download downloads) from the site, $(pl $a 'APK download' 'APK downloads') in total (incl. app updates).
          All time: $(pl $tv visit visits), $(pl $td 'site download' 'site downloads'), $(pl $apk 'APK download' 'APK downloads')."
          at=$(jq '.active.today.a + .active.today.w' "$F"); aw=$(jq '.active.week.a + .active.week.w' "$F"); am=$(jq '.active.month.a + .active.month.w' "$F")
          msg="$msg
          Active users: $at today ($(jq '.active.today.a' "$F") Android, $(jq '.active.today.w' "$F") Windows), $aw in the last 7 days, $am in the last 30 days."
          # Which devices came by this hour (top 5), from the alert texts.
          devices=$(jq -rs --argjson l "$last" '
            [.[] | select(.event=="message" and .time > $l and .title=="New visitor") | .message
              | capture("Someone on (?<d>.+) opened").d]
            | group_by(.) | map({d: .[0], n: length}) | sort_by(-.n) | .[:5]
            | map(.d + (if .n > 1 then " ×\(.n)" else "" end)) | join("; ")' msgs.jsonl)
          [ -n "$devices" ] && msg="$msg
          Devices: $devices"
          if [ "$f" -gt 0 ]; then
            songs=$(jq -r '[.[].m | capture("^\"(?<s>[^\"]+)\"").s] | unique | .[:5] | join(", ")' failed.json)
            msg="$msg
          Songs that wouldn't play: $(pl $f report reports) ($songs)"
          fi
          prio=$([ $((v + d + a + f)) -eq 0 ] && echo 2 || echo 3)
          curl -fsS -X POST "https://ntfy.sh/$TOPIC" \
            -H "Title: Glasswave hourly summary" -H "Tags: bar_chart" -H "Priority: $prio" \
            -H "Click: https://uronlynonny.github.io/Glasswave/stats.html" \
            --data-binary "$msg" > /dev/null

          cd data
          git config user.name "glasswave-stats"
          git config user.email "glasswave-stats@users.noreply.github.com"
          git add stats.json fixed.json
          git commit -qm "Stats for $(date -u +'%Y-%m-%d %H:00') UTC" && git push -q
